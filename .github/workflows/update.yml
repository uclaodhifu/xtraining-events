# 每周自动抓一次国内赛事，有变化才提交（提交后 Vercel 自动发布 events.json）
# 用的是 Linux 机器，每次约 1 分钟，不占 Mac 额度
name: 更新赛事

on:
  schedule:
    - cron: '17 22 * * 0'    # 每周一次：北京时间周一早上 6:17
  workflow_dispatch:         # 也可以在 Actions 页面手动点 Run workflow
  push:
    branches: [main]
    paths: ['scripts/**', 'data/manual.json']

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 抓取并生成 events.json
        run: python3 scripts/build.py
      - name: 有变化就提交
        run: |
          git config user.name "xtraining-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/events.json data/results.json
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git commit -m "赛事数据更新 $(TZ=Asia/Shanghai date +%F)"
          git push
